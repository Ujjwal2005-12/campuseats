openapi: 3.0.3
info:
  title: CampusEats Orders Service
  description:
    "CampusEats Orders Service. Updated for Assignment 6: honest HTTP status codes, RFC 7807 Problem
    Details, field-level validation, UTF-8 response content types, JSON/XML content negotiation, Retry-After, and
    safe error handling. Existing Assignment 5 features such as authorization, ETags, idempotency, rate limiting,
    CORS, and security headers are retained."
  version: 2.1.0
  contact:
    name: CampusEats Engineering Team
servers:
  - url: http://localhost:5050
    description: Local development server
tags:
  - name: Orders
    description: Order lifecycle and query operations
  - name: Cancellations
    description: Non-CRUD order cancellation operations
paths:
  /orders:
    post:
      tags:
        - Orders
      operationId: createOrder
      summary: Create a new order
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateRequest"
      responses:
        "201":
          description:
            Order created successfully Supports application/json (default) and application/xml when requested
            via Accept. Responses are UTF-8.
          headers:
            Location:
              $ref: "#/components/headers/Location"
            ETag:
              $ref: "#/components/headers/ETag"
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-Content-Type-Options:
              $ref: "#/components/headers/X-Content-Type-Options"
            Strict-Transport-Security:
              $ref: "#/components/headers/Strict-Transport-Security"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
            application/xml:
              schema:
                type: string
              example: <order><orderId>ord_58dfd44cd4a7</orderId><status>created</status></order>
        "400":
          $ref: "#/components/responses/Problem400"
        "401":
          $ref: "#/components/responses/Problem401"
        "406":
          $ref: "#/components/responses/Problem406"
        "409":
          description: "Conflict: illegal-transition, item-unavailable, or idempotency conflict; Problem Details."
          headers:
            X-Content-Type-Options:
              $ref: "#/components/headers/X-Content-Type-Options"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Problem422"
        "429":
          $ref: "#/components/responses/Problem429"
        "405":
          $ref: "#/components/responses/Problem405"
        "500":
          $ref: "#/components/responses/Problem500"
        "503":
          $ref: "#/components/responses/Problem503"
        "402":
          $ref: "#/components/responses/Problem402"
      description:
        Validates the entire request before creating an order. Invalid fields are returned together in
        a 422 Problem Details response with errors[]. A successful creation returns 201 and Location.
    get:
      tags:
        - Orders
      operationId: listOrders
      summary: List, filter, sort, and paginate orders
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/CustomerIdQuery"
        - $ref: "#/components/parameters/StatusQuery"
        - $ref: "#/components/parameters/SortQuery"
        - $ref: "#/components/parameters/OrderQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/PageSizeQuery"
      responses:
        "200":
          description:
            List of matching orders Supports application/json (default) and application/xml when requested
            via Accept. Responses are UTF-8.
          headers:
            X-Total-Count:
              schema:
                type: integer
              description: Total count of matching orders across all pages
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-Content-Type-Options:
              $ref: "#/components/headers/X-Content-Type-Options"
            Strict-Transport-Security:
              $ref: "#/components/headers/Strict-Transport-Security"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
            application/xml:
              schema:
                type: string
              example: <order><orderId>ord_58dfd44cd4a7</orderId><status>created</status></order>
        "400":
          $ref: "#/components/responses/Problem400"
        "401":
          $ref: "#/components/responses/Problem401"
        "406":
          $ref: "#/components/responses/Problem406"
        "429":
          $ref: "#/components/responses/Problem429"
        "405":
          $ref: "#/components/responses/Problem405"
        "500":
          $ref: "#/components/responses/Problem500"
        "503":
          $ref: "#/components/responses/Problem503"
      description:
        "Lists orders with optional filters, sorting, and pagination. Supports JSON by default or XML
        when Accept: application/xml is supplied."
    options:
      tags:
        - Orders
      operationId: optionsOrders
      summary: Inspect allowed methods and CORS preflight for /orders
      responses:
        "204":
          description: Allowed methods and CORS preflight response
          headers:
            Allow:
              $ref: "#/components/headers/Allow"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
            Access-Control-Allow-Methods:
              $ref: "#/components/headers/Access-Control-Allow-Methods"
            Access-Control-Allow-Headers:
              $ref: "#/components/headers/Access-Control-Allow-Headers"
        "405":
          $ref: "#/components/responses/Problem405"
        "500":
          $ref: "#/components/responses/Problem500"
        "503":
          $ref: "#/components/responses/Problem503"
  /orders/{orderId}:
    get:
      tags:
        - Orders
      operationId: getOrder
      summary: Retrieve a single order by id with caching and conditional GET
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/IfNoneMatchHeader"
      responses:
        "200":
          description:
            The requested order representation Supports application/json (default) and application/xml
            when requested via Accept. Responses are UTF-8.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-Content-Type-Options:
              $ref: "#/components/headers/X-Content-Type-Options"
            Strict-Transport-Security:
              $ref: "#/components/headers/Strict-Transport-Security"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
            application/xml:
              schema:
                type: string
              example: <order><orderId>ord_58dfd44cd4a7</orderId><status>created</status></order>
        "304":
          description: Not Modified — representation matches client If-None-Match header
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/Cache-Control"
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
        "401":
          $ref: "#/components/responses/Problem401"
        "404":
          $ref: "#/components/responses/Problem404"
        "406":
          $ref: "#/components/responses/Problem406"
        "429":
          $ref: "#/components/responses/Problem429"
        "405":
          $ref: "#/components/responses/Problem405"
        "500":
          $ref: "#/components/responses/Problem500"
        "503":
          $ref: "#/components/responses/Problem503"
      description:
        "Retrieves one order by id. Supports JSON by default or XML when Accept: application/xml is supplied.
        Unknown ids return 404 with type order-not-found."
    patch:
      tags:
        - Orders
      operationId: updateOrderStatus
      summary: Update order status with conditional write (If-Match)
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/IfMatchHeader"
        - $ref: "#/components/parameters/XHTTPMethodOverrideHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdateRequest"
      responses:
        "200":
          description: Order status updated
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-Content-Type-Options:
              $ref: "#/components/headers/X-Content-Type-Options"
            Strict-Transport-Security:
              $ref: "#/components/headers/Strict-Transport-Security"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/Problem400"
        "401":
          $ref: "#/components/responses/Problem401"
        "404":
          $ref: "#/components/responses/Problem404"
        "406":
          $ref: "#/components/responses/Problem406"
        "409":
          description: "Conflict: illegal-transition, item-unavailable, or idempotency conflict; Problem Details."
          headers:
            X-Content-Type-Options:
              $ref: "#/components/headers/X-Content-Type-Options"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "412":
          description: Precondition Failed — If-Match does not match current ETag. UTF-8 Problem Details response.
          headers:
            X-Content-Type-Options:
              $ref: "#/components/headers/X-Content-Type-Options"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Problem422"
        "429":
          $ref: "#/components/responses/Problem429"
        "405":
          $ref: "#/components/responses/Problem405"
        "500":
          $ref: "#/components/responses/Problem500"
        "503":
          $ref: "#/components/responses/Problem503"
      description:
        Updates an order status. Invalid request fields return 422; an illegal state transition returns
        409 with type illegal-transition.
    options:
      tags:
        - Orders
      operationId: optionsOrderItem
      summary: Inspect allowed methods and CORS preflight for /orders/{orderId}
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "204":
          description: Allowed methods and CORS preflight response
          headers:
            Allow:
              $ref: "#/components/headers/Allow"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
            Access-Control-Allow-Methods:
              $ref: "#/components/headers/Access-Control-Allow-Methods"
            Access-Control-Allow-Headers:
              $ref: "#/components/headers/Access-Control-Allow-Headers"
        "405":
          $ref: "#/components/responses/Problem405"
        "500":
          $ref: "#/components/responses/Problem500"
        "503":
          $ref: "#/components/responses/Problem503"
    delete:
      tags:
        - Orders
      operationId: deleteOrder
      summary: Delete an order by id
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/AuthorizationHeader"
      responses:
        "204":
          description: Order deleted successfully; response has no body.
        "401":
          $ref: "#/components/responses/Problem401"
        "404":
          $ref: "#/components/responses/Problem404"
        "405":
          $ref: "#/components/responses/Problem405"
        "429":
          $ref: "#/components/responses/Problem429"
        "500":
          $ref: "#/components/responses/Problem500"
        "503":
          $ref: "#/components/responses/Problem503"
  /orders/{orderId}/cancel:
    post:
      tags:
        - Cancellations
      operationId: cancelOrder
      summary: Cancel an order via non-CRUD sub-resource
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancellationRequest"
      responses:
        "201":
          description:
            Order cancellation record created Supports application/json (default) and application/xml
            when requested via Accept. Responses are UTF-8.
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/X-RateLimit-Remaining"
            X-Content-Type-Options:
              $ref: "#/components/headers/X-Content-Type-Options"
            Strict-Transport-Security:
              $ref: "#/components/headers/Strict-Transport-Security"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancellationResponse"
            application/xml:
              schema:
                type: string
              example: <order><orderId>ord_58dfd44cd4a7</orderId><status>created</status></order>
        "400":
          $ref: "#/components/responses/Problem400"
        "401":
          $ref: "#/components/responses/Problem401"
        "404":
          $ref: "#/components/responses/Problem404"
        "406":
          $ref: "#/components/responses/Problem406"
        "409":
          description: "Conflict: illegal-transition, item-unavailable, or idempotency conflict; Problem Details."
          headers:
            X-Content-Type-Options:
              $ref: "#/components/headers/X-Content-Type-Options"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Problem422"
        "429":
          $ref: "#/components/responses/Problem429"
        "405":
          $ref: "#/components/responses/Problem405"
        "500":
          $ref: "#/components/responses/Problem500"
        "503":
          $ref: "#/components/responses/Problem503"
    options:
      tags:
        - Cancellations
      operationId: optionsCancelOrder
      summary: Inspect allowed methods and CORS preflight for cancellation
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "204":
          description: Allowed methods and CORS preflight response
          headers:
            Allow:
              $ref: "#/components/headers/Allow"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/Access-Control-Allow-Origin"
            Access-Control-Allow-Methods:
              $ref: "#/components/headers/Access-Control-Allow-Methods"
            Access-Control-Allow-Headers:
              $ref: "#/components/headers/Access-Control-Allow-Headers"
        "405":
          $ref: "#/components/responses/Problem405"
        "500":
          $ref: "#/components/responses/Problem500"
        "503":
          $ref: "#/components/responses/Problem503"
  /orders/{orderId}/cancellation:
    post:
      tags:
        - Cancellations
      operationId: cancelOrderAlias
      summary: Cancel an order (Assignment 4 backwards-compatible alias)
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancellationRequest"
      responses:
        "201":
          description:
            Order cancellation record created Supports application/json (default) and application/xml
            when requested via Accept. Responses are UTF-8.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancellationResponse"
            application/xml:
              schema:
                type: string
              example: <order><orderId>ord_58dfd44cd4a7</orderId><status>created</status></order>
        "400":
          $ref: "#/components/responses/Problem400"
        "401":
          $ref: "#/components/responses/Problem401"
        "404":
          $ref: "#/components/responses/Problem404"
        "406":
          $ref: "#/components/responses/Problem406"
        "409":
          $ref: "#/components/responses/Problem409"
        "422":
          $ref: "#/components/responses/Problem422"
        "429":
          $ref: "#/components/responses/Problem429"
        "405":
          $ref: "#/components/responses/Problem405"
        "500":
          $ref: "#/components/responses/Problem500"
        "503":
          $ref: "#/components/responses/Problem503"
    options:
      tags:
        - Cancellations
      operationId: optionsCancelOrderAlias
      summary: Inspect allowed methods and CORS preflight for cancellation alias
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "204":
          description: Allowed methods
          headers:
            Allow:
              $ref: "#/components/headers/Allow"
        "405":
          $ref: "#/components/responses/Problem405"
        "500":
          $ref: "#/components/responses/Problem500"
        "503":
          $ref: "#/components/responses/Problem503"
components:
  headers:
    Location:
      description: URI of newly created resource
      schema:
        type: string
        example: /orders/ord_58dfd44cd4a7
    ETag:
      description: Deterministic resource representation hash (strong ETag)
      schema:
        type: string
        example: '"625c7f4b13b401ec"'
    Cache-Control:
      description: Directives for caching mechanisms
      schema:
        type: string
        example: private, no-cache
    Allow:
      description: Supported HTTP methods for the targeted resource
      schema:
        type: string
        example: GET, PATCH, OPTIONS
    X-RateLimit-Limit:
      description: Maximum request quota per window
      schema:
        type: integer
        example: 60
    X-RateLimit-Remaining:
      description: Remaining quota in current window
      schema:
        type: integer
        example: 59
    Retry-After:
      description:
        Seconds the client should wait before retrying after a 429 Too Many Requests or 503 Service Unavailable
        response.
      schema:
        type: integer
        example: 45
    Access-Control-Allow-Origin:
      description: Permitted cross-origin domain
      schema:
        type: string
        example: https://campuseats.example.com
    Access-Control-Allow-Methods:
      description: Permitted cross-origin methods
      schema:
        type: string
        example: GET, POST, PATCH, OPTIONS
    Access-Control-Allow-Headers:
      description: Permitted request headers in preflight
      schema:
        type: string
        example: Content-Type, Authorization, Idempotency-Key, If-Match, If-None-Match, X-HTTP-Method-Override
    X-Content-Type-Options:
      description: Security header preventing MIME sniffing
      schema:
        type: string
        example: nosniff
    Strict-Transport-Security:
      description: Enforces HTTPS communication
      schema:
        type: string
        example: max-age=31536000; includeSubDomains
  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      description: Unique identifier of the order
      schema:
        type: string
        example: ord_58dfd44cd4a7
    AuthorizationHeader:
      name: Authorization
      in: header
      required: true
      description: Bearer token for client authentication and rate-limiting identity
      schema:
        type: string
        example: Bearer student-token-123
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-supplied key to safely retry non-idempotent operations without duplicates
      schema:
        type: string
        example: idem-abc-12345
    IfMatchHeader:
      name: If-Match
      in: header
      required: false
      description: Resource ETag for optimistic concurrency control (conditional write)
      schema:
        type: string
        example: '"625c7f4b13b401ec"'
    IfNoneMatchHeader:
      name: If-None-Match
      in: header
      required: false
      description: Resource ETag for conditional GET validation
      schema:
        type: string
        example: '"625c7f4b13b401ec"'
    XHTTPMethodOverrideHeader:
      name: X-HTTP-Method-Override
      in: header
      required: false
      description: Fallback header for constrained clients to override POST to PUT/PATCH/DELETE
      schema:
        type: string
        enum:
          - PUT
          - PATCH
          - DELETE
        example: PATCH
    CustomerIdQuery:
      name: customerId
      in: query
      required: false
      description: Filter orders by customer ID
      schema:
        type: string
        example: cust_001
    StatusQuery:
      name: status
      in: query
      required: false
      description: Filter orders by lifecycle status
      schema:
        type: string
        enum:
          - created
          - confirmed
          - preparing
          - dispatched
          - delivered
          - cancelled
        example: confirmed
    SortQuery:
      name: sort
      in: query
      required: false
      description: Sort field for order list
      schema:
        type: string
        enum:
          - createdAt
          - totalAmount
          - orderId
          - status
          - customerId
        default: createdAt
    OrderQuery:
      name: order
      in: query
      required: false
      description: Sort order direction
      schema:
        type: string
        enum:
          - asc
          - desc
        default: desc
    PageQuery:
      name: page
      in: query
      required: false
      description: Page number for pagination (1-based)
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeQuery:
      name: pageSize
      in: query
      required: false
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
  schemas:
    OrderItem:
      type: object
      required:
        - itemId
        - quantity
      properties:
        itemId:
          type: string
          example: item_pizza
        quantity:
          type: integer
          minimum: 1
          example: 2
          description: Must be an integer greater than or equal to 1.
        unitPrice:
          type: number
          format: float
          example: 9.5
    OrderCreateRequest:
      type: object
      required:
        - customerId
        - items
        - address
      properties:
        customerId:
          type: string
          example: cust_001
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItem"
        notes:
          type: string
          example: Extra spicy
        address:
          type: string
          minLength: 1
          description: Delivery address; required when creating an order.
          example: Hostel Block A, Room 204
    OrderStatusUpdateRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - confirmed
            - preparing
            - dispatched
            - delivered
            - cancelled
          example: confirmed
    CancellationRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          example: Ordered wrong canteen stall
    CancellationResponse:
      type: object
      properties:
        orderId:
          type: string
          example: ord_58dfd44cd4a7
        status:
          type: string
          enum:
            - cancelled
        reason:
          type: string
          example: Ordered wrong canteen stall
        cancelledAt:
          type: string
          format: date-time
    Order:
      type: object
      properties:
        orderId:
          type: string
          example: ord_58dfd44cd4a7
        customerId:
          type: string
          example: cust_001
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        status:
          type: string
          enum:
            - created
            - confirmed
            - preparing
            - dispatched
            - delivered
            - cancelled
          example: created
        totalAmount:
          type: number
          format: float
          example: 19.0
        createdAt:
          type: string
          format: date-time
    Problem:
      type: object
      description:
        RFC 7807-style Problem Details response. Responses use Content-Type application/problem+json;
        charset=utf-8. The type URI ends with a stable slug such as empty-cart, item-unavailable, payment-declined,
        order-not-found, or illegal-transition.
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
          description: Stable URI identifying the problem type.
          example: https://campuseats.example.com/errors/order-not-found
        title:
          type: string
          example: Order Not Found
        status:
          type: integer
          minimum: 400
          maximum: 599
          example: 404
        detail:
          type: string
          example: No order exists with the supplied order id.
        errors:
          type: array
          description: Field-level validation errors; present when one or more fields are invalid.
          items:
            $ref: "#/components/schemas/ValidationError"
      example:
        type: https://campuseats.example.com/errors/validation-error
        title: Validation Failed
        status: 422
        detail: One or more fields are invalid.
        errors:
          - field: items
            message: At least one item is required.
          - field: address
            message: Address is required.
    ValidationError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
